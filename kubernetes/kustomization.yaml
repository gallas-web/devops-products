apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: product-crud

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - backend/postgres.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml

images:
  - name: "052464239829.dkr.ecr.eu-north-1.amazonaws.com/product-crud-backend"
    newTag: "latest"
  - name: "052464239829.dkr.ecr.eu-north-1.amazonaws.com/product-crud-frontend"
    newTag: "latest"

commonAnnotations:
  description: "Product CRUD Application - Managed by ArgoCD"
