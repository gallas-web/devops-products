---
apiVersion: v1
kind: Service
metadata:
  name: product-crud-frontend
  namespace: product-crud
  labels:
    app: product-crud-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: external
spec:
  type: LoadBalancer
  selector:
    app: product-crud-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
