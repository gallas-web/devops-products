---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-crud-backend
  namespace: product-crud
  labels:
    app: product-crud-backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: product-crud-backend
  template:
    metadata:
      labels:
        app: product-crud-backend
        version: v1
    spec:
      # ImagePullSecrets pour ECR (créé manuellement)
      
      containers:
      - name: backend
        # ⚠️ REMPLACER: {{AWS_ACCOUNT_ID}} par votre ID AWS (ex: 123456789012)
        image: "052464239829.dkr.ecr.eu-north-1.amazonaws.com/product-crud-backend:latest"
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Variables d'environnement
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx256m -Xms128m"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: AWS_S3_BUCKET
          value: "product-crud-images-052464239829"
        - name: AWS_S3_REGION
          value: "eu-north-1"
        - name: AWS_S3_BASE_URL
          value: "https://product-crud-images-052464239829.s3.eu-north-1.amazonaws.com"
        
        # Probes de santé
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
        
        # Ressources
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "768Mi"
        
        # Logs
        volumeMounts:
        - name: logs
          mountPath: /var/log/app
      
      volumes:
      - name: logs
        emptyDir: {}
      
      # Affinity pour distribuer les pods
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - product-crud-backend
              topologyKey: kubernetes.io/hostname
