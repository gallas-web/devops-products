apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-crud-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: ENVIRONMENT
              value: "staging"
